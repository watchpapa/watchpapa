name: Deploy to DigitalOcean

on:
  push:
    branches: [production]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: watchpapa
          key: ${{ secrets.DROPLET_SSH_KEY }}
          request_pty: true
          script: |
            set -e
            cd /var/www/watchpapa

            git fetch origin production
            git reset --hard origin/production

            npm install --omit=dev

            sudo systemctl restart watchpapa
            sleep 3
            sudo systemctl is-active --quiet watchpapa && echo "OK: server is running"
