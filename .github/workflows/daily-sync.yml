name: Daily TMDB Sync

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: tmdb-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: self-hosted
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TMDB_API_KEY_SECRET: ${{ secrets.TMDB_API_KEY_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm install --omit=dev
      - name: Inject 100 popular movies
        id: popular_movies
        continue-on-error: true
        run: npm run seed:tmdb:popular-movies-today -- --limit=100
      - name: Inject 100 popular shows
        id: popular_shows
        continue-on-error: true
        run: npm run seed:tmdb:popular-shows-today -- --limit=100
      - name: Inject 100 popular people
        id: popular_people
        continue-on-error: true
        run: npm run seed:tmdb:popular-people-today -- --limit=100
      - name: Inject 100 top rated movies
        id: top_rated_movies
        continue-on-error: true
        run: npm run seed:tmdb:top-rated-movies -- --limit=100
      - name: Inject 100 top rated shows
        id: top_rated_shows
        continue-on-error: true
        run: npm run seed:tmdb:top-rated-shows -- --limit=100
      - name: Update popularity scores
        id: update_popularity
        continue-on-error: true
        run: npm run seed:tmdb:update-popularity
      - name: Build failure report
        id: failure_report
        if: always()
        run: |
          FAILED_STEPS=""
          if [ "${{ steps.popular_movies.outcome }}" = "failure" ]; then FAILED_STEPS="$FAILED_STEPS\n- Inject 100 popular movies"; fi
          if [ "${{ steps.popular_shows.outcome }}" = "failure" ]; then FAILED_STEPS="$FAILED_STEPS\n- Inject 100 popular shows"; fi
          if [ "${{ steps.popular_people.outcome }}" = "failure" ]; then FAILED_STEPS="$FAILED_STEPS\n- Inject 100 popular people"; fi
          if [ "${{ steps.top_rated_movies.outcome }}" = "failure" ]; then FAILED_STEPS="$FAILED_STEPS\n- Inject 100 top rated movies"; fi
          if [ "${{ steps.top_rated_shows.outcome }}" = "failure" ]; then FAILED_STEPS="$FAILED_STEPS\n- Inject 100 top rated shows"; fi
          if [ "${{ steps.update_popularity.outcome }}" = "failure" ]; then FAILED_STEPS="$FAILED_STEPS\n- Update popularity scores"; fi

          if [ -n "$FAILED_STEPS" ]; then
            echo "has_failures=true" >> "$GITHUB_OUTPUT"
            {
              echo "body<<EOF"
              echo "Daily TMDB Sync failed in one or more batch steps."
              echo
              echo "Failed steps:"
              printf "%b\n" "$FAILED_STEPS"
              echo
              echo "Run URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "has_failures=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Send email alert
        if: always() && steps.failure_report.outputs.has_failures == 'true'
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT != '' && secrets.SMTP_PORT || '587' }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "[watchpapa] Daily TMDB Sync failure"
          to: alert@watchpapa.tv
          from: ${{ secrets.SMTP_FROM != '' && secrets.SMTP_FROM || secrets.SMTP_USERNAME }}
          body: ${{ steps.failure_report.outputs.body }}
      - name: Fail workflow if any batch step failed
        if: always() && steps.failure_report.outputs.has_failures == 'true'
        run: |
          echo "One or more batch steps failed. See failure report above."
          exit 1
