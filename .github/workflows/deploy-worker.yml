name: Deploy Worker (manual backup)

# Primary deploy path is Cloudflare Workers Builds (dashboard → watchpapa-api →
# Settings → Build, connected to Git, root directory `worker`). This workflow is a
# manual fallback — run it from the Actions tab if Workers Builds is unavailable.
# Trigger-on-push is intentionally omitted so the two don't double-deploy.

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - run: npm ci
      - run: npm test

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          # Repo secrets required: CLOUDFLARE_API_TOKEN (Workers Scripts:Edit +
          # Account Hyperdrive:Read + Zone Workers Routes:Edit), CLOUDFLARE_ACCOUNT_ID.
          # Worker secret required (set once via `wrangler secret put`): TMDB_API_KEY_SECRET.
